name: Build yt-dlp for Android arm64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (to run an aarch64 container on the x86_64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Python inside Termux container
        run: |
          docker run --platform linux/arm64 --name termuxbuild \
            termux/termux-docker:aarch64 \
            bash -c "apt-get update -y && apt-get install -y -o Dpkg::Options::='--force-confnew' python openssl libffi sqlite"

      - name: Copy Python runtime out of the container
        run: |
          mkdir -p work/pkgroot
          docker cp termuxbuild:/data/data/com.termux/files/usr work/pkgroot/usr
          docker rm termuxbuild

      - name: Build yt-dlp.pyz
        run: bash scripts/build_yt_dlp_pyz.sh

      - name: Package self-extracting launcher
        run: bash scripts/package_launcher.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-android-arm64
          path: dist/yt-dlp
